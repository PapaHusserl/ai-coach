<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Пульт</title>
	<link rel="stylesheet" href="/static/pult.css">
</head>
<body>
	<div class="wrap">
		<header>
			<div>
				<h1 id="date"></h1>
				<div id="now" class="sub"></div>
				<div id="metrics" class="sub"></div>
				<div class="sub hline">
					<span id="weight-line"></span>
					<button id="weight-btn" class="link" type="button">записать</button>
					<span id="weight-form" hidden>
						<input id="weight-input" inputmode="decimal" size="5" aria-label="Вес, кг">
						<button id="weight-ok" type="button">OK</button>
					</span>
					<span>·</span>
					<span id="sync-line"></span>
					<button id="sync-btn" class="link" type="button">обновить</button>
				</div>
			</div>
			<span class="days">
				<button id="prev" aria-label="Предыдущий день">‹</button>
				<button id="next" aria-label="Следующий день">›</button>
			</span>
		</header>
		<p id="header-error" class="error" hidden></p>
		<div class="bar"><i id="fill"></i></div>
		<p id="bar-label" class="bar-label"></p>
		<div id="scale"></div>
		<p id="error" class="error" hidden></p>
		<nav id="tabs" role="tablist">
			<button role="tab" data-tab="plan" aria-selected="true">План</button>
			<button role="tab" data-tab="train" aria-selected="false">Тренировки</button>
			<button role="tab" data-tab="food" aria-selected="false">Еда</button>
			<button role="tab" data-tab="state" aria-selected="false">Состояние</button>
		</nav>
		<section data-panel="plan" class="card">
			<div class="plan-h"><h2>План дня</h2></div>
			<p id="empty" class="empty" hidden>На этот день ничего нет.</p>
			<ul id="rows" class="rows"></ul>
		</section>
		<section data-panel="train" class="cards" hidden>
			<div class="card">
				<div class="plan-h"><h2 id="week-title">Неделя</h2> <span class="bar-label">план / факт</span></div>
				<div id="week" class="week"></div>
			</div>
			<div class="card">
				<div class="plan-h"><h2>Нагрузка <span class="bar-label"><span class="ctl">CTL</span> · <span class="atl">ATL</span></span></h2></div>
				<svg id="load-chart" class="chart" viewBox="0 0 320 140"></svg>
				<p id="load-error" class="hint" hidden></p>
			</div>
		</section>
		<section data-panel="food" class="card" hidden><p class="empty">скоро</p></section>
		<section data-panel="state" class="card" hidden><p class="empty">скоро</p></section>
	</div>
	<noscript><p class="error">Нужен включённый JavaScript.</p></noscript>
	<script type="module" src="/static/pult.js"></script>
</body>
</html>
